<!doctype html>
<!-- City Intelligence, the film. 1920 x 1080, 18 s. Each frame is drawn by
     window.renderFrame(t): the camera's crop of the Cycles master stills - day
     and dusk, cross-faded - then the data layer projected through the same
     camera. Nothing here runs on a clock of its own, so
     scripts/video/frames.mjs can step it frame by frame.

     The story is told at dusk. It opens on the city by day; as the systems
     connect, the light goes and the windows come on, and the routes, sensors
     and forecast glow against the dark; the end card is day again. Every
     colour on the page follows the same dusk amount through the custom
     properties set on :root each frame. -->
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0}
 html,body{width:1920px;height:1080px;overflow:hidden;background:rgb(var(--bg));font-family:'DM Sans',Arial,sans-serif;color:var(--ink)}
 :root{--bg:250,248,252;--ink:#52205E;--accent:#983AAC;--muted:#75617C;--quiet:#8B7197;--pill:#E9DEEF;--pill-ink:#71507F}
 canvas,svg,.layer{position:absolute;inset:0;width:1920px;height:1080px}
 .layer{pointer-events:none}
 #veil{position:absolute;inset:0;background:rgb(var(--bg))}
 /* The title and the end card sit over the city's left half; this gives the
    type its own ground without hiding the city behind it. */
 #side{position:absolute;inset:0;background:linear-gradient(90deg,rgb(var(--bg)) 0,rgba(var(--bg),.94) 34%,rgba(var(--bg),.6) 52%,rgba(var(--bg),0) 72%)}
 #shade{position:absolute;inset:auto 0 0;height:420px;background:linear-gradient(to top,rgb(var(--bg)) 0,rgba(var(--bg),.93) 38%,rgba(var(--bg),0))}
 .mark{position:absolute;right:88px;bottom:84px;display:flex;align-items:center;gap:14px;font-size:24px;font-weight:600;letter-spacing:-.5px}
 .mark svg{position:static;width:40px;height:40px}
 .tag{position:absolute;left:88px;display:flex;align-items:center;gap:14px;font-size:17px;color:var(--accent);font-weight:500}
 .tag b{font-size:13px;font-weight:500;background:var(--pill);color:var(--pill-ink);border-radius:20px;padding:6px 12px}
 .title{position:absolute;left:88px;font-size:64px;line-height:1.04;letter-spacing:-.045em;font-weight:500;white-space:nowrap}
 .word{display:inline-block;will-change:transform}
 /* The opening and the end card are daylight scenes: their type keeps the day
    colours while the light changes under it, so it fades out, or in, clean. */
 .daylit{--ink:#52205E;--accent:#983AAC;--muted:#75617C;--pill:#E9DEEF;--pill-ink:#71507F;color:var(--ink)}
 .sub{position:absolute;left:88px;font-size:22px;line-height:1.5;max-width:720px;color:var(--muted)}
 .chip{position:absolute;padding:16px 22px;border-radius:18px;background:#52205EF0;color:#fff;box-shadow:0 18px 50px #52205E30,inset 0 0 0 1px #FFFFFF14}
 .chip span{display:block;font-size:14px;color:#DFB7E9;margin-bottom:4px}
 .chip strong{font-size:34px;font-weight:600;letter-spacing:-.02em;color:#C7FF3D;font-variant-numeric:tabular-nums}
 .chip.pink strong{color:#FFA5DA}
 .card{position:absolute;width:420px;color:#52205E;padding:20px 24px;border-radius:18px;background:#FFFFFFE6;box-shadow:0 20px 60px #52205E24,inset 0 0 0 1px #fff}
 .card h4{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#B8327F;margin-bottom:8px}
 .card p{font-size:21px;line-height:1.4}
 .read{position:absolute;transform:translate(-50%,-100%);padding:8px 14px;border-radius:12px;background:#FFFFFFEB;box-shadow:0 10px 30px #52205E26;font-size:17px;white-space:nowrap}
 .read b{color:#52205E}.read span{color:#75617C;margin-left:6px}
 .note{position:absolute;right:88px;bottom:44px;font-size:15px;color:var(--quiet)}
 .steps{position:absolute;left:88px;display:flex;gap:14px}
 .steps div{color:#52205E;padding:12px 20px;border-radius:999px;font-size:20px;font-weight:600;border:2px solid #E3D6EA;background:#fff}
</style>
<canvas id="plate" width="1920" height="1080"></canvas>
<svg id="data" viewBox="0 0 1920 1080"><defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter></defs><g id="halo" filter="url(#glow)"></g><g id="lines"></g></svg>
<div class="layer" id="ui"></div>
<script type="module">
import {cameraAt,plane,BEATS,WIDTH,HEIGHT} from './timeline.mjs';

const master=await (await fetch('./master.json')).json();
async function load(src){const i=new Image();i.src=src;try{await i.decode();return i;}catch{return null;}}
const day=await load('./master-day.png')??await load('./master.png'),dusk=await load('./master-dusk.png');
const plateEl=document.getElementById('plate'),ctx=plateEl.getContext('2d');
ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
// Scratch canvas for the lens: bloom and tilt-shift are drawn through it.
const lens=Object.assign(document.createElement('canvas'),{width:WIDTH,height:HEIGHT}).getContext('2d');
const halo=document.getElementById('halo'),lines=document.getElementById('lines'),ui=document.getElementById('ui');

// ---- helpers ---------------------------------------------------------------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
const out=x=>1-Math.pow(1-clamp(x),3);                      // ease-out cubic
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const span=(t,[a,b])=>clamp((t-a)/(b-a));
const within=(t,[a,b],pad=0)=>t>=a-pad&&t<b+pad;
const mix=(a,b,u)=>a+(b-a)*u;
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixRgb=(a,b,u)=>{const x=rgb(a),y=rgb(b);return x.map((v,i)=>Math.round(mix(v,y[i],u)));};
const mixHex=(a,b,u)=>'#'+mixRgb(a,b,u).map(v=>v.toString(16).padStart(2,'0')).join('');

// How far into dusk the city is at time t.
// The light goes while the title leaves, so the first chapter's words arrive
// on the dark and never sit mid-grey on mid-grey.
const DUSK_IN=[BEATS.title[1]-.7,BEATS.title[1]+.4],DUSK_OUT=[BEATS.end[0]-.45,BEATS.end[0]+.3];
const duskAt=t=>dusk?smooth(span(t,DUSK_IN))*(1-smooth(span(t,DUSK_OUT))):0;
// Page colours by day and at dusk.
const PALETTE={bg:['#FAF8FC','#15112A'],ink:['#52205E','#F7F1FB'],accent:['#983AAC','#E9A8F7'],
 muted:['#75617C','#BDB0CE'],quiet:['#8B7197','#9E90B4'],pill:['#E9DEEF','#3A2D55'],'pill-ink':['#71507F','#E4D6F0']};
let cam;
/** World point -> screen pixels, through this frame's camera. */
function screen(p){
 const [u,v]=plane(p),k=WIDTH/cam.scale,[tu,tv]=plane(cam.target),h=cam.scale*HEIGHT/WIDTH;
 return [(u-tu+cam.scale/2)*k,(tv+h/2-v)*k];
}
function catmull(pts,n){
 const out=[];
 for(let s=0;s<pts.length-1;s++)for(let i=0;i<n;i++){
  const u=i/n,p=k=>pts[Math.max(0,Math.min(pts.length-1,k))],[a,b,c,d]=[p(s-1),p(s),p(s+1),p(s+2)];
  out.push([0,1,2].map(j=>0.5*(2*b[j]+(-a[j]+c[j])*u+(2*a[j]-5*b[j]+4*c[j]-d[j])*u*u+(-a[j]+3*b[j]-3*c[j]+d[j])*u*u*u)));
 }
 out.push(pts[pts.length-1]);return out;
}

// ---- the city's data layer, in world space (as civic-motion.js builds it) ---
// These are the page's city. A city modelled for the film
// (scripts/blender/metropolis.py) writes its own anchors to master-layout.json
// - landmark tops, sensors, the gauge, the flood area, the traffic lanes - and
// they replace these, so the data sits on whichever city is on screen.
const layout=await fetch('./master-layout.json').then(r=>r.ok?r.json():null).catch(()=>null);
const at=(key,fallback)=>layout?.[key]??fallback;
const DISTRICTS=Object.fromEntries(Object.entries({civic:[-2,14,1],hospital:[29,10,1],school:[29,6,24],water:[-2,5,24],industry:[-2,13,-23],energy:[29,12,-23],transit:[-30,6,1]})
 .map(([id,p])=>[id,layout?.[id]?[layout[id][0],layout[id][1]-1,layout[id][2]]:p]));
const HUB=at('hub',[-60,10,1]);
const ROUTES=Object.entries(DISTRICTS).map(([id,[x,y,z]],i)=>({id,pink:i%3===0,
 pts:catmull([[x,y+1,z],[x-9,y+6,z],[-46,11,z*.35],HUB],18)}));
const SENSORS=[
 ['water',at('sensor-water',[3,7,24]),'Water level','1.20 m'],
 ['industry',at('sensor-industry',[3,15,-23]),'Air quality','PM2.5 18'],
 ['energy',at('sensor-energy',[34,14,-23]),'Energy','420 kW'],
 ['hospital',at('sensor-hospital',[34,12,1]),'Building','normal'],
];
const RISK=at('risk',[[-13.5,4.5,14],[9.5,4.5,14],[9.5,4.5,30],[-13.5,4.5,30]]);     // forecast area
const RISK_CENTRE=at('risk-centre',[-2,4.5,22]);
const GAUGE=at('gauge',[-10.6,6,19.4]);
// Traffic: cars as pairs of lights along each lane, only once the light has
// gone - by day the plate's own parked cars are enough.
const LANES=(layout?.lanes??[]).map((lane,i)=>{
 const [a,b]=lane.points,len=Math.hypot(b[0]-a[0],b[2]-a[2]);
 return {a,b,len,cars:Array.from({length:Math.max(2,Math.round(len/16))},(_,k)=>((k+.37*i)*16+i*5.3)%len)};
});
const SPEED=7.5;       // units a second

// ---- one frame ---------------------------------------------------------------
const mark='<svg viewBox="0 0 32 32"><path d="m16 3 12 7v13l-12 6L4 23V10Z" fill="#C7FF3D" stroke="#52205E" stroke-width="1.4"/><path d="m4 10 12 7 12-7M16 17v12" fill="none" stroke="#52205E" stroke-width="1.4"/></svg>';
function words(text,t0,t,{stagger=.07,dur=.6,dir=1}={}){
 return text.split(' ').map((w,i)=>{const u=out((t-t0-i*stagger)/dur);
  return `<span class="word" style="opacity:${u};transform:translateY(${(1-u)*28*dir}px)">${w}</span>`;}).join(' ');
}
function beat(t,[a,b],fadeIn=.45,fadeOut=.35){return smooth((t-a)/fadeIn)*(1-smooth((t-(b-fadeOut))/fadeOut));}

window.renderFrame=function(t){
 cam=cameraAt(t);
 // Plate: this frame's crop of the master still.
 const k=master.density,[tu,tv]=plane(cam.target),h=cam.scale*HEIGHT/WIDTH;
 const sx=(tu-cam.scale/2-master.u0)*k,sy=(master.v1-(tv+h/2))*k;
 const dk=duskAt(t),root=document.documentElement.style;
 for(const [name,[a,b]] of Object.entries(PALETTE))
  name==='bg'?root.setProperty('--bg',mixRgb(a,b,dk).join(',')):root.setProperty('--'+name,mixHex(a,b,dk));
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';
 ctx.fillStyle=mixHex(...PALETTE.bg,dk);ctx.fillRect(0,0,WIDTH,HEIGHT);
 const crop=[sx,sy,cam.scale*k,h*k,0,0,WIDTH,HEIGHT];
 if(dk<1)ctx.drawImage(day,...crop);
 if(dk>0){ctx.globalAlpha=dk;ctx.drawImage(dusk,...crop);ctx.globalAlpha=1;}
 // Bloom: the lit windows and lamps bleed a little light at dusk.
 if(dk>0){
  lens.clearRect(0,0,WIDTH,HEIGHT);lens.filter='blur(16px) brightness(1.15)';lens.drawImage(plateEl,0,0);lens.filter='none';
  ctx.globalCompositeOperation='screen';ctx.globalAlpha=.42*dk;ctx.drawImage(lens.canvas,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 }
 // Tilt-shift: the top and bottom of the frame fall a little out of focus, a
 // model city seen through a lens. The data layer on top stays sharp.
 lens.clearRect(0,0,WIDTH,HEIGHT);lens.filter='blur(3.5px)';lens.drawImage(plateEl,0,0);lens.filter='none';
 const focus=lens.createLinearGradient(0,0,0,HEIGHT);
 focus.addColorStop(0,'#000');focus.addColorStop(.3,'#0000');focus.addColorStop(.66,'#0000');focus.addColorStop(1,'#000');
 lens.globalCompositeOperation='destination-in';lens.fillStyle=focus;lens.fillRect(0,0,WIDTH,HEIGHT);lens.globalCompositeOperation='source-over';
 ctx.drawImage(lens.canvas,0,0);
 // Vignette at dusk.
 if(dk>0){
  const v=ctx.createRadialGradient(WIDTH*.55,HEIGHT*.45,HEIGHT*.35,WIDTH*.55,HEIGHT*.45,WIDTH*.72);
  v.addColorStop(0,'#0B081800');v.addColorStop(1,`rgba(11,8,24,${.55*dk})`);
  ctx.fillStyle=v;ctx.fillRect(0,0,WIDTH,HEIGHT);
 }

 let g='',glow='',html='';
 if(dk>.02)for(const lane of LANES){
  const dir=[(lane.b[0]-lane.a[0])/lane.len,(lane.b[2]-lane.a[2])/lane.len];
  for(const start of lane.cars){
   const s=(start+t*SPEED)%lane.len;
   // Fade out at the ends of the lane so cars never pop on the slab's edge.
   const edge=clamp(Math.min(s,lane.len-s)/3);
   const p=k=>[lane.a[0]+dir[0]*(s-k),lane.a[1],lane.a[2]+dir[1]*(s-k)];
   const [hx,hy]=screen(p(0)),[tx,ty]=screen(p(1.9)),[sx,sy]=screen(p(4.5));
   const o=dk*edge;
   g+=`<line x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}" stroke="#FF3B4E" stroke-opacity="${.35*o}" stroke-width="3" stroke-linecap="round"/>`;
   g+=`<circle cx="${tx}" cy="${ty}" r="2.6" fill="#FF4A5C" opacity="${o}"/><circle cx="${hx}" cy="${hy}" r="3" fill="#FFF4DC" opacity="${o}"/>`;
   glow+=`<circle cx="${hx}" cy="${hy}" r="9" fill="#FFE2B0" opacity="${.5*o}"/>`;
  }
 }
 // Routes: drawn in during Data, kept through AI, packets always moving.
 const draw=span(t,[BEATS.data[0]+.3,BEATS.data[1]-.6]);
 const routesOn=t>=BEATS.data[0]&&t<BEATS.end[0]+.6;
 const routeFade=routesOn?(1-smooth((t-BEATS.end[0])/.6))*(t<BEATS.iot[0]?1:t<BEATS.ai[0]?.75:.55):0;
 if(routeFade>0){
  ROUTES.forEach((r,i)=>{
   const local=clamp((draw*ROUTES.length*1.6-i*1.0)/1.6);
   const pts=r.pts.map(screen),n=Math.max(2,Math.round(pts.length*out(local)));
   if(local<=0)return;
   const d='M'+pts.slice(0,n).map(p=>p.map(v=>v.toFixed(1)).join(',')).join('L');
   const col=r.pink?'#F05BB5':'#C7FF3D';
   g+=`<path d="${d}" fill="none" stroke="${col}" stroke-opacity="${.3*routeFade}" stroke-width="14" stroke-linecap="round"/>`;
   glow+=`<path d="${d}" fill="none" stroke="${col}" stroke-opacity="${(.25+.55*dk)*routeFade}" stroke-width="${10+10*dk}" stroke-linecap="round"/>`;
   g+=`<path d="${d}" fill="none" stroke="${col}" stroke-opacity="${routeFade}" stroke-width="4.5" stroke-linecap="round"/>`;
   if(local>=1)for(let j=0;j<3;j++){
    const u=((t*.28+j/3+i*.07)%1),p=pts[Math.floor(u*(pts.length-1))];
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${col}" opacity="${routeFade}"/>`;
    glow+=`<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="${col}" opacity="${dk*routeFade}"/>`;
   }
   // Where each district's route starts, a small ring pulses once as it joins.
   const [ox,oy]=pts[0],pulse=clamp((local-.02)/.5);
   if(pulse>0&&pulse<1)g+=`<circle cx="${ox}" cy="${oy}" r="${10+pulse*30}" fill="none" stroke="${col}" stroke-width="3" opacity="${(1-pulse)*routeFade}"/>`;
  });
  const [hx,hy]=screen(HUB),arrive=clamp(draw*1.2-.2);
  g+=`<circle cx="${hx}" cy="${hy}" r="${16+6*Math.sin(t*5)}" fill="#C7FF3D" opacity="${.9*arrive*routeFade}"/>`;
 }

 // Sensors: rings and readings over the districts during IoT.
 const iot=beat(t,[BEATS.iot[0],BEATS.ai[0]+.2]);
 if(iot>0)SENSORS.forEach(([id,at,label,value],i)=>{
  const u=back((t-BEATS.iot[0]-.25-i*.22)/.55);if(u<=0)return;
  const [x,y]=screen(at),o=iot*clamp(u);
  g+=`<circle cx="${x}" cy="${y}" r="${22*u}" fill="#C7FF3D33" stroke="#C7FF3D" stroke-width="4" opacity="${o}"/>`;
  g+=`<circle cx="${x}" cy="${y}" r="${7*u}" fill="#52205E" opacity="${o}"/>`;
  const wave=((t-BEATS.iot[0]-i*.22)*.9)%1;
  g+=`<circle cx="${x}" cy="${y}" r="${22+wave*40}" fill="none" stroke="#C7FF3D" stroke-width="3" opacity="${o*(1-wave)}"/>`;
  html+=`<div class="read" style="left:${x}px;top:${y-34}px;opacity:${o};transform:translate(-50%,calc(-100% + ${(1-clamp(u))*12}px))"><b>${label}</b><span>${value}</span></div>`;
 });

 // AI: the forecast area grows over the water district, the gauge climbs.
 const ai=beat(t,[BEATS.ai[0],BEATS.end[0]+.3],.5,.5);
 if(ai>0){
  const grow=out((t-BEATS.ai[0]-.6)/2.2),[cx,cy]=screen(RISK_CENTRE);
  const poly=RISK.map(p=>{const [x,y]=screen(p);return [cx+(x-cx)*(.35+.65*grow),cy+(y-cy)*(.35+.65*grow)];});
  g+=`<polygon points="${poly.map(p=>p.join(',')).join(' ')}" fill="#F05BB5" fill-opacity="${.26*ai*clamp(grow*3)}" stroke="#F05BB5" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="${.9*ai*clamp(grow*3)}"/>`;
  const [hx,hy]=screen(HUB);
  for(let j=0;j<2;j++){const w=((t-BEATS.ai[0])*.7+j/2)%1;
   g+=`<circle cx="${hx}" cy="${hy}" r="${30+w*80}" fill="none" stroke="#F05BB5" stroke-width="4" opacity="${ai*(1-w)*.9}"/>`;}
  const level=mix(1.2,1.6,smooth((t-BEATS.ai[0]-.3)/1.6)),forecast=mix(1.6,1.9,smooth((t-BEATS.ai[0]-1.9)/1.4));
  const [gx,gy]=screen(GAUGE);
  g+=`<circle cx="${gx}" cy="${gy}" r="9" fill="#F05BB5" opacity="${ai}"/>`;
  html+=`<div class="chip ${level>1.4?'pink':''}" style="left:${gx+34}px;top:${gy-150}px;opacity:${ai}"><span>Water level · gauge W-03</span><strong>${level.toFixed(2)} m${t>BEATS.ai[0]+1.9?` → ${forecast.toFixed(2)} m`:''}</strong></div>`;
  const rc=out((t-BEATS.ai[0]-2.6)/.7);
  html+=`<div class="card" style="right:88px;top:${150+(1-rc)*24}px;opacity:${ai*rc}"><h4>AI recommendation</h4><p>Review the exposed access road and prepare the response team.</p><p style="font-size:15px;color:#8B7197;margin-top:10px">Illustrative forecast · a person decides</p></div>`;
 }
 lines.innerHTML=g;halo.innerHTML=glow;

 // Titles and furniture.
 const titleOn=beat(t,BEATS.title,.01,.55),endOn=smooth((t-BEATS.end[0]-.1)/.7);
 // The city fades up behind the title from the page colour, and fades half
 // back for the end card; the side gradient backs the type in both.
 const veil=Math.max(mix(.96,0,smooth((t-.3)/2.2))*(t<BEATS.title[1]?1:0),endOn*.45);
 const side=Math.max(titleOn,endOn);
 html=`<div id="veil" style="opacity:${veil}"></div><div id="side" style="opacity:${side}"></div><div id="shade" style="opacity:${(1-endOn)*smooth((t-BEATS.title[1]+.6)/.6)}"></div>`+html;
 html+=`<div class="mark">${mark}City Intelligence</div>`;
 if(titleOn>0){
  html+=`<div class="daylit">`;
  html+=`<div class="tag" style="top:420px;opacity:${titleOn*out(t/.5)}"><b>Presale overview</b>Smart city platform</div>`;
  html+=`<div class="title" style="top:470px;font-size:96px;opacity:${titleOn}">${words('From data to',.25,t)}<br>${words('a city in sync.',.55,t)}</div>`;
  html+=`<div class="sub" style="top:690px;opacity:${titleOn*out((t-1.1)/.6)}">One picture of the city, built from the systems that already run it.</div></div>`;
 }
 const chapters=[
  [BEATS.data,'01 · Phase 1','Data Consolidation','Connect the systems','you already have.'],
  [BEATS.iot,'02 · Phase 2','IoT Data Integration','See field conditions','as they happen.'],
  [BEATS.ai,'03 · Phase 3','AI-Powered Intelligence','Anticipate. Recommend.','People decide.'],
 ];
 for(const [range,num,name,l1,l2] of chapters){
  const on=beat(t,range,.45,.4);if(on<=0)continue;
  const t0=range[0];
  html+=`<div class="tag" style="top:810px;opacity:${on*out((t-t0)/.4)}"><b>${num}</b>${name}</div>`;
  html+=`<div class="title" style="top:858px;opacity:${on}">${words(l1,t0+.1,t,{stagger:.06})}<br>${words(l2,t0+.3,t,{stagger:.06})}</div>`;
 }
 // Connected systems: 0/7 before Data, counting as the routes connect.
 const countOn=beat(t,[BEATS.data[0],BEATS.ai[0]],.45,.4);
 if(countOn>0){
  const n=Math.round(clamp(draw*1.05)*7);
  html+=`<div class="chip" style="right:88px;top:150px;opacity:${countOn}"><span>Connected systems</span><strong>${n} / 7</strong>${t>BEATS.iot[0]?'<span style="margin:6px 0 0;color:#E1CDE8">+ 128 IoT sensors online</span>':''}</div>`;
 }
 if(endOn>0){
  html+=`<div class="title daylit" style="top:360px;font-size:92px;opacity:${endOn}">${words('Connect first.',BEATS.end[0]+.15,t)}<br>${words('Expand with purpose.',BEATS.end[0]+.4,t)}</div>`;
  const s=out((t-BEATS.end[0]-.9)/.6);
  html+=`<div class="steps" style="top:600px;opacity:${s};transform:translateY(${(1-s)*16}px)"><div style="border-color:#C7FF3D">Data</div><div style="border:0;background:none;color:#B9A7C6">→</div><div style="border-color:#C7FF3D">IoT</div><div style="border:0;background:none;color:#B9A7C6">→</div><div style="border-color:#F05BB5">AI</div></div>`;
 }
 html+=`<div class="note">Illustrative experience · mock data</div>`;
 ui.innerHTML=html;
};
await document.fonts.ready;
window.ready=true;
renderFrame(0);
</script>
